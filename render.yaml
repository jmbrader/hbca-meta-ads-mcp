services:
  - type: web
    name: hbca-meta-ads-mcp
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        value: act_10151727290614507
      - key: META_API_VERSION
        value: v26.0
      - key: MCP_PATH_SECRET
        generateValue: true
